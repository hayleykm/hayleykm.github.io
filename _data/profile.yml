short_about: "I research patterns of recreational drug use, harm reduction, and how families and communities can communicate about risk in practical, evidence-informed ways."

# About page: longer biography.
long_bio: |
  I am a public health researcher focused on recreational drugs, prevention, and harm reduction.
  My work combines epidemiology, qualitative interviews, and policy analysis to understand what
  actually helps people make safer decisions.

  I collaborate with clinicians, schools, and community organizations to translate research into
  language that families can use. This site shares publications, writing, and parent-focused
  answers to common questions.

