# Home page: short intro paragraph.
short_about: "I research patterns of recreational drug use, practices of harm reduction, and how families and communities can communicate about risk in practical, evidence-informed ways."
short_about_extra: "I am always up for conversations about drugs — from research and policy to real-world experiences and ideas. If you’re interested in discussing, debating, or just exploring the topic, feel free to get in touch."

# About page: longer biography.
long_bio: |
  I am an Anthropologist specializing in youth drug use, harm reduction, and the social dynamics
  of substance use, with a PhD in Anthropology from Wageningen University & Research and graduate
  training in Medical Anthropology, Sociology, and Public Health. My work draws on interdisciplinary
  training from the University of Amsterdam and the University of Waterloo, combining ethnographic
  depth with public health perspectives to better understand how young people navigate pleasure,
  risk, and care. Through research, publications, and international collaborations, I am committed
  to advancing peer-informed, evidence-based harm reduction practices that center lived experience
  and contribute to more just drug policy.

