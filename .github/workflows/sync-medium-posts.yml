name: Sync Medium Posts

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  sync-medium-posts:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: false

      - name: Sync Medium posts
        env:
          MEDIUM_FEED_URL: ${{ secrets.MEDIUM_FEED_URL }}
        run: ruby scripts/sync_medium_posts.rb

      - name: Commit updated publications data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Sync Medium posts"
          file_pattern: "_data/publications.yml"
