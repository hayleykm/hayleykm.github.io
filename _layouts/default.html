<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% assign p = site.data.profile %}{% if page.title %}{{ page.title }} | {% endif %}{{ p.name | default: site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}

    <main id="main-content" class="container page-content">
      {{ content }}
    </main>

    {% include footer.html %}
    <script>
      (function () {
        var links = document.querySelectorAll("a[href]");
        links.forEach(function (link) {
          var href = link.getAttribute("href");
          if (!href || href.startsWith("#") || href.startsWith("mailto:") || href.startsWith("tel:")) {
            return;
          }
          try {
            var url = new URL(href, window.location.origin);
            if (url.origin !== window.location.origin) {
              link.setAttribute("target", "_blank");
              link.setAttribute("rel", "noopener noreferrer");
            }
          } catch (e) {
            // Ignore malformed URLs.
          }
        });
      })();
    </script>
  </body>
</html>
