---
layout: default
---
{% assign p = site.data.profile %}

<h1>About</h1>

{% if p.about_photo %}
  <figure class="about-photo-card">
    <img src="{{ p.about_photo | relative_url }}" alt="{{ p.about_photo_alt | default: 'Photo of Hayley K Murray' }}" loading="lazy">
  </figure>
{% endif %}

{{ p.long_bio | default: "" | markdownify }}

<p>
  <a class="button-link" href="{{ p.cv_file | default: '/assets/cv/cv.pdf' | relative_url }}">Download CV (PDF)</a>
</p>

{% if content and content != '' %}
  <section class="page-note">
    {{ content }}
  </section>
{% endif %}
